# =============================================
# 1. 基础与性能优化 (核心响应)
# =============================================

# 修改前缀键为 Ctrl+a (原 Ctrl+b 太远了，Ctrl+a 更符合习惯)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 彻底消除 Esc 键延迟 (对 Vim 用户极其重要)
set -s escape-time 0
# 增加快捷键重复判定时间
set -sg repeat-time 300
# 开启鼠标支持 (点击切换、拖动调整大小、滚动)
set -g mouse on
# 增加历史滚动行数
set -g history-limit 50000
# 开启焦点事件，让内部的 Vim 能感知到窗口切换
set -s focus-events on
# 窗口和面板编号从 1 开始 (键盘上方数字键更好按)
set -g base-index 1
setw -g pane-base-index 1
# 自动重命名窗口
set -g renumber-windows on


# 快速重载配置并显示提示
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"
# 直观的分屏快捷键 (| 垂直分屏, - 水平分屏)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"



# =============================================
# 2. Ghostty / 现代终端特性支持
# =============================================

# 开启 True Color (24-bit color) 支持
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# 允许程序透传 (在 tmux 里显示图片、特殊协议等)
set -g allow-passthrough on
# 支持更复杂的组合键识别
set -s extended-keys on


# =============================================
# 3. status bar
# =============================================

set -g status-style "bg=default,fg=#7a7e81" # 背景透明，文字灰阶
set -g status-left "#[fg=#ffffff,bold] #S  " # 白色加粗 Session 名
set -g status-right "#[fg=#7a7e81] %H:%M "    # 只显示时间，极其干净
setw -g window-status-current-format "#[fg=#ffffff,bold] #I:#W " # 当前窗口白色
setw -g window-status-format "#[fg=#4e5153] #I:#W "              # 其他窗口深灰


# =============================================
# 4. 插件管理 (TPM)
# =============================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # 重启后恢复会话
set -g @plugin 'tmux-plugins/tmux-continuum'   # 自动保存

# 初始化 TPM (必须放在最后一行)
run '~/.tmux/plugins/tpm/tpm'
